name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # WPF and the Live Captions integration are Windows-only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LiveTranslator.sln

      - name: Build
        run: dotnet build LiveTranslator.sln -c Release --no-restore

      - name: Test
        run: dotnet test LiveTranslator.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish (self-contained single file)
        run: >
          dotnet publish src/LiveTranslator.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o artifacts/LiveTranslator

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslator-win-x64-standalone
          path: artifacts/LiveTranslator
          retention-days: 14
